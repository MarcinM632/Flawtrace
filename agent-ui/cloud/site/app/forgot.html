<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset your password · Flawtrace</title><meta name="robots" content="noindex"><link rel="icon" href="/_gw/static/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/_gw/static/gw.css"></head>
<body>
<main class="shell">
  <a class="brand" href="{{SITE_URL}}"><img src="/_gw/static/logo.svg" alt="" width="30" height="30">Flawtrace</a>
  <div class="panel">
    <h1>Reset your password</h1>
    <p class="sub">Enter your e-mail. If there is an account, we send a link that works for one hour.</p>
    <div id="done" class="msg ok" hidden></div>
    <form data-api="/_gw/api/forgot" data-done="#done" data-done-text="If there is an account with this address, a message is on its way." data-hide="1" novalidate>
      <div id="err" class="msg err" hidden></div>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <button class="btn block" type="submit">Send the link</button>
    </form>
    <div class="links"><a href="/_gw/login">Back to sign in</a></div>
  </div>
</main>
<script src="/_gw/static/gw.js"></script>
</body></html>
