[pytest]
testpaths = tests
python_files = test_*.py
# UI tests keep a trace and a screenshot of every failure in test-results/ (open with: playwright show-trace).
addopts = -ra --strict-markers --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results

markers =
    SMOKE: short check that the environment is alive, safe to run often
    UI: drives a web app in a browser (Playwright); slower, needs the app reachable
    INTEGRATION: ISTQB integration level — verifies the interface/interaction between two or more backend services through their APIs, no UI involved
    SYSTEM: ISTQB system level — exercises the complete integrated system end-to-end, normally through the real UI
