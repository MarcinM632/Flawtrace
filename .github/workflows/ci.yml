name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python test tooling
        run: pip install pytest pytest-playwright requests
      - name: Unit and API tests
        # On failure the failing tests become annotations, readable on the run page and in the e-mail without the full log.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || {
            sed -n '/^✖ failing tests:/,$p' test-output.txt > failing.txt
            for t in $(grep -n '^test at ' failing.txt | cut -d: -f1 | head -10); do
              msg=$(sed -n "${t},$((t+12))p" failing.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
              echo "::error title=Failing test::$msg"
            done
            exit 1
          }

  # The cloud image must keep building (browser, git and the app in one image). Nothing is pushed anywhere.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the Flawtrace Cloud image
        run: docker build -t flawtrace-cloud:ci .
      - name: The image starts and answers its health check
        run: |
          docker run -d --name ft -e CLOUD_MASTER_SECRET=ci-secret-0123456789abcdef0123456789 -e SITE_HOST=localhost:8080 -e APP_HOST=app.localhost:8080 -p 8080:8080 flawtrace-cloud:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          docker logs ft
          docker rm -f ft
